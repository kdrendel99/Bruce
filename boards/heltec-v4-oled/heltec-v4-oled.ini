; Heltec WiFi LoRa 32 V4 + M5Stack Cap CC1101  (mainline Bruce 1.17)
; 128x64 SSD1306 OLED via LovyanGFX mono; Sub-GHz on the M5 Cap CC1101.
; Single PRG button (GPIO0): tap=advance, hold=select, double-tap=back.
; NOTE: mainline has no UI_COMPACT yet, so the full-size UI renders on the OLED
; (likely cramped) until the compact-layout port lands. This env is step 1:
; get CURRENT Bruce + the Cap + the OLED backend building/booting on this board.

[env:heltec-v4-oled]
extends = env
board                           = esp32s3
board_build.arduino.memory_type = qio_qspi      ; ESP32-S3R2, 2MB QSPI PSRAM
board_build.partitions          = custom_16Mb.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

build_src_filter = ${env.build_src_filter} +<../boards/heltec-v4-oled>

build_flags =
    ${env.build_flags}
    -Iboards/heltec-v4-oled
    -DARDUINO_HELTEC_WIFI_LORA_32_V4
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEVICE_NAME='"Heltec-V4-Cap"'

    ; ── OLED: SSD1306 128x64 over I2C via LovyanGFX mono ──────────────────────
    -DHAS_SCREEN=1
    -DUSE_LOVYANGFX=1
    -DLOVYAN_BUS=Bus_I2C
    -DLOVYAN_I2C_BUS=1
    -DLOVYAN_PANEL=Panel_SSD1306
    -DTFT_I2C_ADDR=0x3C
    -DTFT_ADDR=0x3C
    -DTFT_I2C_PORT=0
    -DTFT_I2C_WRITE=400000
    -DTFT_I2C_READ=400000
    -DTFT_SDA=17
    -DTFT_SCL=18
    -DTFT_RST=21
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=64
    -DTFT_MEM_WIDTH=128
    -DTFT_MEM_HEIGHT=64
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_INVERTION=0
    -DTFT_RGB_ORDER=0
    -DTFT_CS=-1
    -DTFT_BUSY_PIN=-1
    -DTFT_BL=-1
    -DBACKLIGHT=-1
    -DMINBRIGHT=0
    -DROTATION=0
    -DSMOOTH_FONT=0
    -DTFT_DISPON=0xAF
    -DTFT_DISPOFF=0xAE
    -DTFT_MONOCHROME=1

    ; ── Compact 128x64 UI (ported from BruceButBetter UI_COMPACT) ─────────────
    -DUI_COMPACT=1
    -DFP=1
    -DFM=1
    -DFG=2
    -DSTATUS_BAR_HEIGHT=14
    -DBORDER_PAD_Y=14
    -DBORDER_PAD_X=8

    ; Serial-commands task runs SimpleCLI::parse + command callbacks that vsnprintf
    ; large JSON (info/storage) and, over BLE, the deeper BLESerialService vprintf/
    ; drainTx/bleNotifyRetry chain. The 8KB default overflows on the BLE path and
    ; smashes adjacent memory (random null-deref / heap-poison crash on Remote
    ; Control). Mako/Pebble bump this to 12KB; give it 16KB for headroom.
    -DSERIAL_CMDS_TASK_STACK_SIZE=1024*16

    -DVEXT_PIN=36            ; OLED power rail (active LOW), enabled in interface.cpp

    ; ── CC1101 (M5 Cap, proven wiring) ────────────────────────────────────────
    -DSPI_MOSI_PIN=47
    -DSPI_SCK_PIN=33
    -DSPI_MISO_PIN=48
    -DSPI_SS_PIN=39
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=4
    -DCC1101_SS_PIN=39
    -DCC1101_MOSI_PIN=47
    -DCC1101_SCK_PIN=33
    -DCC1101_MISO_PIN=48
    ; M5 Cap antenna switch (mainline 1.17 already has the code for these)
    -DCAP_CC1101_SS_PIN=39
    -DCAP_CC1101_SW0_PIN=38
    -DCAP_CC1101_GDO0_PIN=4

    ; ── ST25R3916 NFC (the M5 Cap's second chip, shares the SPI bus above) ─────
    ; CC1101 + ST25R3916 share SCK/MOSI/MISO (33/47/48); each has its own CS. The
    ; Cap silkscreen swaps the CS labels, so printed "CC CS"->GPIO6 is really NFC_CS
    ; and printed "NFC CS"->GPIO39 is really CC1101_CS (see CAP_CC1101_SS_PIN above).
    ; NFC_IRQ is the one Cap signal that wasn't in the original 9-wire harness; it's
    ; wired to GPIO44. Pin choice matters for firmware-switching: the Meshtastic V4
    ; variant leaves only 3/26/43/44/45 unassigned, and of those 44 (U0RXD) is the
    ; only one that is non-strapping, not on the flash bus, and INPUT-natured — so the
    ; ST25R3916's push-pull IRQ can never contend with the ROM bootloader, Meshtastic,
    ; or Meshcore. (GPIO34 was wrong: it's VGNSS_Ctrl/PIN_GPS_EN, driven as an output.)
    ; Cap POWER_EN isn't on the 14-pin connector (internal 100k pull-up keeps the
    ; regulator on), so it's intentionally not defined.
    -DCAP_NFC_SS_PIN=6
    -DCAP_NFC_IRQ_PIN=44
    -DCAP_NFC_SCK_PIN=33
    -DCAP_NFC_MISO_PIN=48
    -DCAP_NFC_MOSI_PIN=47

    ; ── Rotary encoder (EC11) for navigation ──────────────────────────────────
    ; Quadrature A/B on GPIO43 (U0TXD) + GPIO3 (JTAG strap) — both clear of the
    ; Cap, GPS (34/38-42) and LoRa pins. Integrated push-button on GPIO0, parallel
    ; with the onboard PRG button. A turn emits Prev/Next (which the compact grid's
    ; NO_LR_BUTTONS branch walks linearly); press emits Select. RotaryEncoder lib is
    ; vendored in lib/, pulled in automatically by HAS_ENCODER.
    -DHAS_ENCODER
    -DENCODER_INA=43
    -DENCODER_INB=3
    -DENCODER_KEY=0
    -DSEL_BTN=0           ; == ENCODER_KEY; some core paths still reference SEL_BTN
    -DNO_LR_BUTTONS=1     ; grid walks linearly on Prev/Next (see display.cpp)

    ; ── Power / deep sleep ─────────────────────────────────────────────────────
    ; Bruce's goToDeepSleep() already does the ESP32-S3 deep sleep; it only needs to
    ; know which pin wakes the device. GPIO0 (encoder/PRG button) wakes it (active LOW).
    ; The Heltec V4.3 has no software power-kill (the main 3V3 rail is always on; only
    ; Vext is switchable), so deep sleep is the platform's lowest-power "off" — this also
    ; backs the powerOff() override in interface.cpp, on battery or USB alike.
    -DDEEPSLEEP_WAKEUP_PIN=0

    ; ── Battery monitoring (Heltec V4.3 LiPo divider) ──────────────────────────
    ; VBAT -> ~4.9:1 divider -> GPIO1 (ADC1_CH0), gated by an ADC-enable MOSFET on
    ; GPIO37 (HIGH = connect the divider; held enabled in _setup_gpio since Bruce's
    ; ANALOG_BAT reader doesn't toggle it). Multiplier 4.9*1.045 is the Heltec/
    ; Meshtastic V4 calibration. Reuses Bruce's existing analog reader (hal/power/gauge.cpp).
    ; This describes the V4.3 PLATFORM; a unit with a damaged battery circuit (e.g. a228)
    ; will read nonsense — a unit defect, not a board-definition concern.
    -DANALOG_BAT_PIN=1
    -DANALOG_BAT_MULTIPLIER=5.1205f
    -DANALOG_BAT_MIN_MV=3300
    -DANALOG_BAT_MAX_MV=4200
    -DBAT_ADC_CTRL=37

    ; ── No SD / NRF24 / GPS / LoRa / Ethernet / FM on this build ───────────────
    -DSDCARD_CS=-1
    -DSDCARD_SCK=-1
    -DSDCARD_MISO=-1
    -DSDCARD_MOSI=-1
    -DDISABLE_LORA
    -DDISABLE_GPS
    -DDISABLE_ETHERNET
    -DDISABLE_FM

    -DRXLED=-1
    -DTXLED=35
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    ; (removed unused -DSERIAL_TX=43/-DSERIAL_RX=44: nothing in src/ reads them, and
    ;  GPIO44 is now the ST25R3916 NFC IRQ — see the Cap NFC block above.)

lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.0

lib_ignore =
    ${env.lib_ignore}
    TFT_eSPI
    FastLED
